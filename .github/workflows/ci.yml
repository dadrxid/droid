name: CI

# Verify only — never publishes images. Broken upstream merges cannot overwrite production.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type Check, and Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile

      - name: Verify lockfile is in sync
        env:
          HUSKY: '0'
        run: |
          cp yarn.lock yarn.lock.check
          yarn install --ignore-scripts
          diff -q yarn.lock yarn.lock.check

      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn typecheck

      - name: Verify fork production safeguards
        run: |
          grep -q 'ghcr.io/dadrxid/droid:stable' docker-compose.yml
          if grep -E 'ghcr.io/museofficial|:latest' docker-compose.yml; then
            echo 'docker-compose.yml must pin ghcr.io/dadrxid/droid:stable — never upstream or :latest'
            exit 1
          fi

      - name: Verify Docker image builds
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
