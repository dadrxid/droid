name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    name: Lint, Type Check, and Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: |
          npm install -g yarn@1.22.22
          yarn --version
          yarn install --frozen-lockfile

      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn typecheck

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/dadrxid/droid:latest,ghcr.io/dadrxid/droid:${version},ghcr.io/dadrxid/droid:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
