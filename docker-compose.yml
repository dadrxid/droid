version: "3"
services:
  droid:
    # NEVER use a floating "latest" tag in production — it auto-updates when CI/deploy runs.
    # Update only after manually running "Deploy Stable" in GitHub Actions, then pull this tag.
    # After Deploy Stable on GitHub, pull this tag in Portainer (Recreate with pull).
    # To verify deploy: run /version in Discord — commit should match the latest GitHub SHA.
    image: ghcr.io/dadrxid/droid:stable
    container_name: droid
    restart: on-failure:5
    volumes:
      - /DATA/AppData/muse:/data
    # Set secrets in Portainer → Stack → Environment variables (no .env file in git)
    environment:
      - DATA_DIR=/data
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - BOT_STATUS=${BOT_STATUS:-online}
      - BOT_ACTIVITY_TYPE=${BOT_ACTIVITY_TYPE:-WATCHING}
      - BOT_ACTIVITY=${BOT_ACTIVITY:-Hyperstrike DS4 · TMR · droidfix.uk}
      - PLAYLIST_API_URL=${PLAYLIST_API_URL:-}
      - HOMELAB_API_URL=${HOMELAB_API_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*migrate-and-start' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
