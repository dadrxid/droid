version: "3"
services:
  droid:
    image: ghcr.io/dadrxid/droid:latest
    build: .
    container_name: droid
    restart: on-failure:5
    volumes:
      - /DATA/AppData/muse:/data
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - BOT_STATUS=${BOT_STATUS:-online}
      - BOT_ACTIVITY_TYPE=${BOT_ACTIVITY_TYPE:-LISTENING}
      - BOT_ACTIVITY=${BOT_ACTIVITY:-music}
      - PLAYLIST_API_URL=${PLAYLIST_API_URL:-}
      - HOMELAB_API_URL=${HOMELAB_API_URL:-}
