version: "3"
services:
  droid:
    # Pin to a version tag for stability, e.g. ghcr.io/dadrxid/droid:2.11.4
    image: ghcr.io/dadrxid/droid:latest
    container_name: droid
    # on-failure avoids hammering Discord when login is rate-limited
    restart: on-failure:5
    volumes:
      - /DATA/AppData/muse:/data
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - BOT_STATUS=${BOT_STATUS:-online}
      - BOT_ACTIVITY_TYPE=${BOT_ACTIVITY_TYPE:-LISTENING}
      - BOT_ACTIVITY=${BOT_ACTIVITY:-music}
      - PLAYLIST_API_URL=${PLAYLIST_API_URL:-}
      - HOMELAB_API_URL=${HOMELAB_API_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*migrate-and-start' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
